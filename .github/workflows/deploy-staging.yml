# develop 에 머지되면 테스트 서버(staging)에 자동 배포한다.
# 진짜 API 키는 GitHub 저장소의 'staging' Environment 와 테스트 서버에만 있고, 개발자 PC 에는 필요 없다.
# 처음 설정: deploy/배포안내.md "4. 테스트 서버" 참고. 설정 전에는 배포 단계를 건너뛰고 테스트만 돈다.
name: 테스트 서버 배포 (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:        # Actions 화면에서 수동으로 다시 배포

concurrency:
  group: staging-deploy     # 배포가 겹치지 않게 한 번에 하나씩
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ steps.addr.outputs.url }}
    env:
      HOST: ${{ secrets.STAGING_HOST }}
      SSH_USER: ${{ vars.STAGING_USER || 'ubuntu' }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 테스트
        run: npm test

      - name: 테스트 서버 주소
        id: addr
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::STAGING_HOST 가 설정되지 않아 배포를 건너뜁니다 (deploy/배포안내.md 4절)"
            echo "ready=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 주소를 따로 정하지 않았으면 서버 IP 로 만든 sslip.io 주소 (setup.sh 와 같은 규칙)
          domain="${STAGING_DOMAIN:-staging.${HOST//./-}.sslip.io}"
          echo "ready=1" >> "$GITHUB_OUTPUT"
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "url=https://$domain" >> "$GITHUB_OUTPUT"

      - name: 코드 묶기
        if: steps.addr.outputs.ready == '1'
        run: |
          echo "develop@$(git rev-parse --short HEAD)" > REVISION
          out="$RUNNER_TEMP/up"; mkdir -p "$out"
          tar -czf "$out/catolimi-staging.tar.gz" --exclude=./.git --exclude=./.env --exclude='./data/*.db*' --exclude=./node_modules .
          if tar -tzf "$out/catolimi-staging.tar.gz" | grep -Eq '\.db($|-)|^\./\.env$'; then echo "묶음에 DB 나 .env 가 들어갔어요"; exit 1; fi
          cp deploy/setup.sh "$out/catolimi-staging-setup.sh"

      - name: API 키 파일 (서버 .env 에 반영)
        if: steps.addr.outputs.ready == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          umask 077
          f="$RUNNER_TEMP/up/catolimi-staging.env"; : > "$f"
          for k in ANTHROPIC_API_KEY DEEPL_API_KEY ADMIN_TOKEN ANTHROPIC_MODEL; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> "$f"; fi
          done
          echo "올릴 설정: $(cut -d= -f1 "$f" | paste -sd, -)"

      - name: 서버에 올리고 설치
        if: steps.addr.outputs.ready == '1'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          DOMAIN: ${{ steps.addr.outputs.domain }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else echo "::warning::STAGING_KNOWN_HOSTS 가 없어 서버 지문을 처음 접속 때 받아요"; ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts; fi
          opt=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30)
          up="$RUNNER_TEMP/up"
          scp "${opt[@]}" "$up/catolimi-staging.tar.gz" "$up/catolimi-staging.env" "$up/catolimi-staging-setup.sh" "$SSH_USER@$HOST:/tmp/"
          ssh "${opt[@]}" "$SSH_USER@$HOST" "sed -i 's/\r$//' /tmp/catolimi-staging-setup.sh && sudo INSTANCE=staging DOMAIN='$DOMAIN' bash /tmp/catolimi-staging-setup.sh; s=\$?; rm -f /tmp/catolimi-staging-setup.sh /tmp/catolimi-staging.env; exit \$s"
          rm -f ~/.ssh/deploy_key

      - name: 배포 확인 (방금 올린 커밋이 떠 있는지)
        if: steps.addr.outputs.ready == '1'
        env:
          URL: ${{ steps.addr.outputs.url }}
        run: |
          want="$(cat REVISION)"
          for i in $(seq 1 20); do   # 처음에는 HTTPS 인증서 발급에 시간이 걸릴 수 있다
            got=$(curl -fsS "$URL/api/health" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{const h=JSON.parse(s);console.log(h.env+" "+h.revision)}catch(e){}})' || true)
            if [ "$got" = "staging $want" ]; then echo "테스트 서버: $URL ($want)"; exit 0; fi
            sleep 6
          done
          echo "테스트 서버가 $want 로 응답하지 않아요 (받은 값: '${got:-없음}')"; exit 1
